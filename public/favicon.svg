<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="favGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#181826" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>
  <!-- Pitch Black OLED Rounded Background -->
  <rect width="128" height="128" rx="28" fill="#000000" />
  <rect width="128" height="128" rx="28" fill="url(#favGlow)" opacity="0.6" />
  <!-- Subtle Border in Catppuccin Surface1 -->
  <rect x="2.5" y="2.5" width="123" height="123" rx="26" fill="none" stroke="#262638" stroke-width="3" />
  <!-- Terminal Monogram Mark (>_ AC) -->
  <text x="64" y="66" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, Consolas, monospace" font-size="48" font-weight="800" letter-spacing="-1">
    <tspan fill="#cba6f7">&gt;_</tspan><tspan dx="2" fill="#cdd6f4">AC</tspan>
  </text>
</svg>
